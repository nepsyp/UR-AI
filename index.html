<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07070D" />
  <title>Log in · YOUR AI</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="login">
  <main class="auth-wrap">
    <div class="auth-card">
      <a href="index.html" class="brand" aria-label="YOUR AI home">
        <img src="assets/logo.svg" alt="YOUR AI logo" />
      </a>

      <h1>Welcome back</h1>
      <p>Log in to continue to your dashboard.</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input id="login-email" class="input" type="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" class="input" type="password" placeholder="Your password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
        <p id="login-message" class="form-message" aria-live="polite"></p>
      </form>

      <div class="divider">or</div>
      <button id="google-btn" class="btn btn-ghost btn-block" type="button">Continue with Google</button>

      <p class="auth-switch">New to YOUR AI? <a href="signup.html">Create an account</a></p>
    </div>
  </main>

  <script type="module" src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
