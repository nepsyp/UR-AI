<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>araa</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      background: linear-gradient(135deg, #101426, #252044, #101426);
      font-family: Arial, sans-serif;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 650px;
      text-align: center;
      padding: 45px 25px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 22px;
      background: rgba(255,255,255,0.07);
      box-shadow: 0 15px 50px rgba(0,0,0,0.3);
    }

    .logo {
      font-size: 38px;
      font-weight: bold;
      letter-spacing: 5px;
      margin-bottom: 35px;
      color: #b8a5ff;
    }

    .bengali {
      font-size: 24px;
      line-height: 1.9;
      margin-bottom: 25px;
    }

    .english {
      font-size: 17px;
      line-height: 1.8;
      color: #c8c5d8;
    }

    .line {
      width: 65px;
      height: 3px;
      background: #a78bfa;
      margin: 25px auto;
      border-radius: 10px;
    }

    footer {
      margin-top: 40px;
      font-size: 12px;
      color: #88849e;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">araa</div>

    <p class="bengali">
      এই কাজটি করা আমার ধর্মের বিপক্ষে,
      তাই আমি এটি বন্ধ করে দিচ্ছি।
    </p>

    <div class="line"></div>

    <p class="english">
      Doing this goes against my religion,
      so I am shutting it down.
    </p>

    <footer>
      araa © 2026
    </footer>

  </main>

</body>
</html>
